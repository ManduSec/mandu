# ubuntu-2604 — Ubuntu 26.04 LTS ("resolute") amd64 cloud image, kernel 7.0
# (docs/design/testing/os-test-matrix.md §3). The modern-hardened-host posture: new
# kernel, ADDFD present, unprivileged userns expected AppArmor-restricted
# (asserted from the 24.04 precedent — VERIFY on first boot, §3 †; the guest
# runner prints the actual sysctl so any suite log answers it).
# IMAGE_SHA256 left empty deliberately: the URL tracks the current point
# release, so a pinned digest would break on every image refresh.
EXECUTOR=qemu
IMAGE_URL="https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img"
IMAGE_SHA256=""
CPUS=8
MEM=8192
TIMEOUT=5400
LABELS="os=linux kernel=7.0 userns=apparmor-restricted addfd=yes fresh-posture=confined setup=installs"
SYSCTLS=""
SUITES="smoke kernel all wrapper fresh-install fresh-agents"
