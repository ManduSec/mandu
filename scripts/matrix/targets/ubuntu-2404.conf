# ubuntu-2404 — Ubuntu 24.04 LTS ("noble") amd64 cloud image, kernel 6.8
# (docs/design/testing/os-test-matrix.md §10.3.1). The end-user release's primary
# platform and the one where the AppArmor unprivileged-userns restriction
# bites. Since the npm bundle ships the prebuilt whole-agent guard (plan 10
# §11.7, 2026-09-24) a stock install is `confined` by the guard alone with no
# sudo (`fresh-posture=confined`); `mandu setup` still has the bind-mount
# layer to install (`setup=installs`), as a second layer, not a prerequisite.
# IMAGE_SHA256 left empty for the same reason as ubuntu-2604: the URL tracks
# the current point release.
EXECUTOR=qemu
IMAGE_URL="https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
IMAGE_SHA256=""
CPUS=8
MEM=8192
TIMEOUT=2400
LABELS="os=linux kernel=6.8 userns=apparmor-restricted addfd=yes fresh-posture=confined setup=installs"
SYSCTLS=""
# Not in SUITES (run-matrix.sh runs every declared suite): release-upgrade, a
# real do-release-upgrade to 26.04 over three boots, about 30 minutes and
# ~1 GB of downloads. Run it by hand before a release or after a change to
# setup.ts / bwrap-grant.ts / scripts/apparmor/ (os-test-matrix.md §10.15):
#   scripts/matrix/run.sh ubuntu-2404 release-upgrade
SUITES="smoke fresh-install fresh-agents"
