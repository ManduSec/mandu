# ubuntu-2510 — Ubuntu 25.10 ("questing") amd64 cloud image, kernel 6.17
# (docs/design/testing/os-test-matrix.md §3). The interim release between the two
# LTSes, and the first matrix target where Ubuntu's own
# bwrap-userns-restrict profile (enabled from 25.04) meets Mandu without an
# LTS upgrade in between: a user on the interim track upgrades 25.04 → 25.10
# → 26.04, so the no-nesting rule is already in force when Mandu is
# installed (rootless-confinement-ubuntu-2404.md §12.3). It follows the
# 26.04 story (verified 2026-09-28, os-test-matrix.md §10.15): the
# distro bubblewrap forbids a sandbox inside it, the first launch is confined
# by the guard alone, `mandu setup` installs Mandu's own bubblewrap.
# 25.10 reached end of life in July 2026; its archive still serves questing
# (checked 2026-09-28). When it moves to old-releases.ubuntu.com, set
# APT_MIRROR below (lib/qemu.sh points cloud-init and the guest at it).
# IMAGE_SHA256 left empty for the same reason as ubuntu-2604.
EXECUTOR=qemu
IMAGE_URL="https://cloud-images.ubuntu.com/releases/25.10/release/ubuntu-25.10-server-cloudimg-amd64.img"
IMAGE_SHA256=""
CPUS=8
MEM=8192
TIMEOUT=5400
LABELS="os=linux kernel=6.17 userns=apparmor-restricted addfd=yes fresh-posture=confined setup=installs"
SYSCTLS=""
SUITES="smoke fresh-install fresh-agents"
