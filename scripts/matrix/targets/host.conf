# host — run suites directly on this machine (docs/design/testing/os-test-matrix.md §3).
# Covers this host's kernel 6.8 / userns-on / ADDFD-live / Landlock-v4 posture
# for free and doubles as the harness self-test vehicle (the per-push CI
# matrix-smoke job). The old-kernel (5.4-era, ADDFD-absent) posture moved to the
# VM tier (scripts/kernel-vm.sh / the ubuntu-2204 target).
# SUITES omits `all`: the per-push CI `test` job already runs scripts/test-all.sh
# on this host; re-running it nightly in the matrix would double wall-clock for
# zero new coverage. (`run.sh host all` still works manually.)
EXECUTOR=host
LABELS="os=linux kernel=6.8 userns=on addfd=yes landlock=v4"
SUITES="smoke kernel wrapper"
